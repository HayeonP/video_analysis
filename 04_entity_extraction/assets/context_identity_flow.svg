<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 830" role="img" aria-label="시간순 시각 맥락을 사용하는 새 분석 구조"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><rect width="1050" height="830" rx="16" fill="#f8fafc"/><rect x="50" y="20" width="950" height="75" rx="12" fill="#e2e8f0" stroke="#94a3b8"/><text x="525.0" y="47" text-anchor="middle" font-size="20" font-weight="bold">03 선택 프레임 → 검출·추적·샷별 개체</text><text x="525.0" y="79" text-anchor="middle" font-size="15">선택된 프레임만 사용 · 기존 전처리 유지</text><rect x="50" y="125" width="950" height="80" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="525.0" y="152" text-anchor="middle" font-size="20" font-weight="bold">① 임시 전역 목록 → 외형 확인 → 프레임별 몸 보정</text><text x="525.0" y="184" text-anchor="middle" font-size="15">Thinking 후보 비교 / Instruct 외형과 중복 박스 확인</text><rect x="50" y="240" width="455" height="110" rx="12" fill="#ede9fe" stroke="#94a3b8"/><text x="277.5" y="267" text-anchor="middle" font-size="20" font-weight="bold">② 선명한 참조 사진 모음</text><text x="277.5" y="299" text-anchor="middle" font-size="15">기존 이름을 가리고 복장·외형 변화를 표시</text><rect x="545" y="240" width="455" height="110" rx="12" fill="#fef3c7" stroke="#94a3b8"/><text x="772.5" y="267" text-anchor="middle" font-size="20" font-weight="bold">시간순 샷 이미지 + 영상 종류</text><text x="772.5" y="299" text-anchor="middle" font-size="15">앞뒤 장면 / 반복 등장 / 예고편이라는 약한 힌트</text><rect x="50" y="390" width="950" height="105" rx="12" fill="#ede9fe" stroke="#94a3b8"/><text x="525.0" y="417" text-anchor="middle" font-size="20" font-weight="bold">③ 인물 재배정 + 전체 한국어 장면 기억</text><text x="525.0" y="449" text-anchor="middle" font-size="15">Thinking 1회 · 반복 등장·경계 연속성 / 전체 한국어 요약</text><rect x="50" y="535" width="950" height="105" rx="12" fill="#ede9fe" stroke="#94a3b8"/><text x="525.0" y="562" text-anchor="middle" font-size="20" font-weight="bold">④ 희소한 동물 관측 재배정</text><text x="525.0" y="594" text-anchor="middle" font-size="15">DINO 후보·시점 검색 + Instruct 1회 해부학적 충돌 검사</text><rect x="50" y="680" width="950" height="75" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="525.0" y="707" text-anchor="middle" font-size="20" font-weight="bold">⑤ 최종 ID·몸 제약 검증 → 한국어 요약·연결 근거 출력</text><text x="525.0" y="739" text-anchor="middle" font-size="15">잘못 묶인 그룹은 나눌 수 있음 / 관측은 보존</text><rect x="50" y="780" width="950" height="35" rx="12" fill="#e2e8f0" stroke="#94a3b8"/><text x="525.0" y="807" text-anchor="middle" font-size="20" font-weight="bold">새 뷰어 5006 · 기존 기준 뷰어 5004 보존</text><path d="M525 95V125" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M277 205V240" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M277 350V390" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M772 350V390" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M525 495V535" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M525 640V680" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M525 755V780" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/></svg>