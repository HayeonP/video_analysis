<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" role="img" aria-label="샘플링 이후 분석 구조"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs><rect width="1080" height="660" rx="18" fill="#f1f5f9"/><rect x="130" y="18" width="820" height="82" rx="12" fill="#d1fae5" stroke="#94a3b8"/><text x="540" y="49" text-anchor="middle" font-size="23" fill="#172554">선택된 279장</text><text x="540" y="79" text-anchor="middle" font-size="19" fill="#334155">원본 번호·시각 유지</text><path d="M540 101 V121" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="124" width="820" height="82" rx="12" fill="#d1fae5" stroke="#94a3b8"/><text x="540" y="155" text-anchor="middle" font-size="23" fill="#172554">① 찾기 + 임시 추적</text><text x="540" y="185" text-anchor="middle" font-size="19" fill="#334155">YOLO11x → DINOv2 → 위치·시간</text><path d="M540 207 V227" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="230" width="820" height="82" rx="12" fill="#e0e7ff" stroke="#94a3b8"/><text x="540" y="261" text-anchor="middle" font-size="23" fill="#172554">② 샷 안의 대상 정리</text><text x="540" y="291" text-anchor="middle" font-size="19" fill="#334155">Qwen Instruct → Local ID</text><path d="M540 313 V333" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="336" width="820" height="82" rx="12" fill="#e0e7ff" stroke="#94a3b8"/><text x="540" y="367" text-anchor="middle" font-size="23" fill="#172554">③ 샷 사이 연결</text><text x="540" y="397" text-anchor="middle" font-size="19" fill="#334155">DINO·얼굴 후보 → Qwen Thinking</text><path d="M540 419 V439" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="442" width="820" height="82" rx="12" fill="#e0e7ff" stroke="#94a3b8"/><text x="540" y="473" text-anchor="middle" font-size="23" fill="#172554">④ 외형·몸 충돌 보정</text><text x="540" y="503" text-anchor="middle" font-size="19" fill="#334155">Instruct → 필요한 판단만