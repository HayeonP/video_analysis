<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#63748d"/></marker></defs><rect width="1100" height="720" fill="#f5f8fc"/><style>text{font-family:Arial,"NanumGothic",sans-serif;fill:#18344c}.title{font-weight:bold;font-size:21px}.sub{font-size:16px}.line{fill:none;stroke:#63748d;stroke-width:2;marker-end:url(#arr)}</style><rect x="240" y="18" width="620" height="68" rx="12" fill="#e4edff" stroke="#bdccdf"/><text x="550.0" y="47" text-anchor="middle" class="title">입력 영상 → 02. 샷 경계 검출</text><text x="550.0" y="73" text-anchor="middle" class="sub">TransNetV2 · 원본 프레임을 빠짐없이 연속 구간으로 분할</text><path d="M550 86 V111" class="line"/><rect x="240" y="112" width="620" height="68" rx="12" fill="#fff" stroke="#bdccdf"/><text x="550.0" y="141" text-anchor="middle" class="title">샷별 원본 + 시간 좌표</text><text x="550.0" y="167" text-anchor="middle" class="sub">이번 입력: 17샷 / 1,253프레임 / 52.21초</text><path d="M400 180 V202 H275 V220" class="line"/><path d="M700 180 V202 H825 V220" class="line"/><rect x="40" y="222" width="470" height="79" rx="12" fill="#e5f5ee" stroke="#bdccdf"/><text x="275.0" y="251" text-anchor="middle" class="title">03. Adaptive sampling</text><text x="275.0" y="277" text-anchor="middle" class="sub">Optical flow + 색상 변화 → 279개 선택 이미지</text><rect x="590" y="222" width="470" height="79" rx="12" fill="#e4edff" stroke="#bdccdf"/><text x="825.0" y="251" text-anchor="middle" class="title">04-A. 원본 전체 프레임 추적</text><text x="825.0" y="277" text-anchor="middle" class="sub">YOLO11x → BoT-SORT + DINOv2</text><path d="M825 301 V324" class="line"/><rect x="590" y="326" width="470" height="79" rx="12" fill="#fff" stroke="#bdccdf"/><text x="825.0" y="355" text-anchor="middle" class="title">04-B. 샷 내부 정리 → Local Entity</text><text x="825.0" y="381" text-anchor="middle" class="sub">시간 구간 보정 + Qwen3-VL-8B-Instruct</text><path d="M275 301 V635 H570 V676 H587" fill="none" stroke="#479b79" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="55" y="340" class="sub">선택 프레임·유지 시간은</text><text x="55" y="363" class="sub">Adaptive 출력에 사용</text><text x="55" y="393" class="sub">추적·VLM 근거는 원본과</text><text x="55" y="416" class="sub">트랙별 대표 이미지를 사용</text><path d="M825 405 V428" class="line"/><rect x="590" y="430" width="470" height="90" rx="12" fill="#e4edff" stroke="#bdccdf"/><text x="825.0" y="459" text-anchor="middle" class="title">04-C. 샷 사이 연결 → Global Entity</text><text x="825.0" y="485" text-anchor="middle" class="sub">DINO / 얼굴 후보 → 8B Thinking 시각 비교</text><text x="825" y="506" text-anchor="middle" class="sub">동시 신체·부분 소유 검증 → 제약을 만족할 때 병합</text><rect x="40" y="448" width="470" height="72" rx="12" fill="#fff3d9" stroke="#bdccdf"/><text x="275.0" y="477" text-anchor="middle" class="title">선택 입력: 제목·출처 있는 짧은 소개</text><text x="275.0" y="503" text-anchor="middle" class="sub">약한 문맥만 제공 · 동일성의 증거가 아님</text><path d="M510 482 H587" class="line"/><path d="M825 520 V543" class="line"/><rect x="590" y="545" width="470" height="70" rx="12" fill="#fff" stroke="#bdccdf"/><text x="825.0" y="574" text-anchor="middle" class="title">04-D. 공통 ID로 요약 보정</text><text x="825.0" y="600" text-anchor="middle" class="sub">Qwen3-VL-8B-Instruct · 불확실한 부분 서술 보호</text><path d="M825 615 V642" class="line"/><rect x="590" y="644" width="470" height="64" rx="12" fill="#e5f5ee" stroke="#bdccdf"/><text x="825.0" y="673" text-anchor="middle" class="title">04-E. 검증·영상·뷰어</text><text x="825.0" y="699" text-anchor="middle" class="sub">Global 목록 / 등장표 / 원본·Adaptive 박스 영상</text><text x="40" y="682" class="sub">SAM 2.1: 선택 경로 / 이번 실행 생략.</text></svg>