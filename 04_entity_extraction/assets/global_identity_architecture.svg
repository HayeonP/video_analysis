<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="704" viewBox="0 0 1120 704"><title>Local singleton seeds with focused visual identity comparisons</title><desc>Local temporal repair and source-frame ownership audit precede separate identity seeds. Strong detector/category conflicts only propose a source-image classification review using up to three frames. DINO, text and optional SFace retrieve candidates; YuNet proposes face details. Face scores never authorize identity joins. Each side contains up to three source-bound prototypes from already connected shots of one identity hypothesis. Qwen3-VL-8B selects view numbers; code binds each selection to its source local and frame. General pair prompts exclude prior local descriptions; source-backed context is a weak prior only. Boundary and ownership checks retain dedicated evidence paths. Only visually supported pairs join. Geometric separation proposes review; confirmed co-visible physical distinctions or explicit local constraints prevent merging. Cross-shot objections remain reviewable; hidden faces or clothing differences remain uncertain. Part-only ownership needs visible same-scene attachment. External introductions are optional weak context, never identity proof.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#49729e"/></marker></defs><rect width="1120" height="704" rx="18" fill="#f7faff"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="30" y="24" width="240" height="72" rx="12" fill="#e7f0ff" stroke="#b9cde2" stroke-width="1.5"/><text x="150.0" y="54.0" font-size="20" font-weight="700" fill="#15314d">Video</text><text x="150.0" y="80.0" font-size="14" fill="#50677e">Original frames + timeline</text><rect x="314" y="24" width="345" height="72" rx="12" fill="#fff" stroke="#b9cde2" stroke-width="1.5"/><text x="486.5" y="54.0" font-size="20" font-weight="700" fill="#15314d">Shot boundaries</text><text x="486.5" y="80.0" font-size="14" fill="#50677e">02 · TransNetV2</text><rect x="703" y="24" width="387" height="72" rx="12" fill="#fff" stroke="#b9cde2" stroke-width="1.5"/><text x="896.5" y="54.0" font-size="20" font-weight="700" fill="#15314d">Adaptive sampling</text><text x="896.5" y="80.0" font-size="14" fill="#50677e">03 · Optical flow + SSIM</text><path d="M270 60 L310 60" stroke="#49729e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M659 60 L699 60" stroke="#49729e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="122" width="1060" height="214" rx="12" fill="#edf3fb"/><text x="560" y="151" font-size="19" font-weight="700" fill="#15314d">04 · PER-SHOT OBSERVATIONS</text><rect x="52" y="169" width="306" height="64" rx="12" fill="#fff" stroke="#b9cde2" stroke-width="1.5"/><text x="205.0" y="195.0" font-size="20" font-weight="700" fill="#15314d">Shot 1</text><text x="205.0" y="221.0" font-size="14" fill="#50677e">YOLO11x + BoT-SORT + DINOv2</text><path d="M205 233 L205 251" stroke="#49729e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="52" y="255" width="306" height="60" rx="12" fill="#fff" stroke="#b9cde2" stroke-width="1.5"/><text x="205.0" y="279.0" font-size="20" font-weight="700" fill="#15314d">Local entities</text><text x="205.0" y="305.0" font-size="14" fill="#50677e">Qwen3-VL-8B · source frames + crops</text><rect x="408" y="169" width="306" height="64" rx="12" fill="#fff" stroke="#b9cde2" stroke-width="1.5"/><text x="561.0" y="195.0" font-size="20" font-weight="700" fill="#15314d">Shot 2</text><text x="561.0" y="221.0" font-size="14" fill="#50677e">YOLO11x + BoT-SORT + DINOv2</text><path d="M561 233 L561 251" stroke="#49729e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="408" y="255" width="306" height="60" rx="12" fill="#fff" stroke="#b9cde2" stroke-width="1.5"/><text x="561.0" y="279.0" font-size="20" font-weight="700" fill="#15314d">Local entities</text><text x="561.0" y="305.0" font-size="14" fill="#50677e">Qwen3-VL-8B · source frames + crops</text><rect x="764" y="169" width="306" height="64" rx="12" fill="#fff" stroke="#b9cde2" stroke-width="1.5"/><text x="917.0" y="195.0" font-size="20" font-weight="700" fill="#15314d">Shot N</text><text x="917.0" y="221.0" font-size="14" fill="#50677e">YOLO11x + BoT-SORT + DINOv2</text><path d="M917 233 L917 251" stroke="#49729e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="764" y="255" width="306" height="60" rx="12" fill="#fff" stroke="#b9cde2" stroke-width="1.5"/><text x="917.0" y="279.0" font-size="20" font-weight="700" fill="#15314d">Local entities</text><text x="917.0" y="305.0" font-size="14" fill="#50677e">Qwen3-VL-8B · source frames + crops</text><text x="560" y="331" font-size="12" fill="#50677e">Optional SAM · Temporal repair · ownership/class audits (up to 3 source frames)</text><path d="M896 96 L896 118" stroke="#49729e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="376" width="672" height="92" rx="12" fill="#e5efff" stroke="#819fc5" stroke-width="1.5"/><text x="366.0" y="411.0" font-size="20" font-weight="700" fill="#15314d">Two identities · diverse shot views</text><text x="366.0" y="437.0" font-size="14" fill="#50677e">DINO / SFace candidates → up to 3 source views + face details</text><text x="366.0" y="457.0" font-size="14" fill="#50677e">Qwen3-VL-8B Thinking · source-bound visual comparisons</text><rect x="746" y="376" width="344" height="92" rx="12" fill="#f3f0fe" stroke="#c5b7e3" stroke-width="1.5"/><text x="918.0" y="411.0" font-size="20" font-weight="700" fill="#15314d">Optional public introduction</text><text x="918.0" y="437.0" font-size="14" fill="#50677e">Title + short source-backed synopsis</text><text x="918.0" y="457.0" font-size="14" fill="#50677e">Weak prior; never identity proof</text><path d="M560 336 L560 372" stroke="#49729e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M746 422 L706 422" stroke="#49729e" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="30" y="509" width="1060" height="82" rx="12" fill="#e6f4f0" stroke="#91bcae" stroke-width="1.5"/><text x="560.0" y="544.0" font-size="20" font-weight="700" fill="#15314d">Evidence-constrained identity graph</text><text x="560.0" y="570.0" font-size="14" fill="#50677e">Same-frame bodies → Instruct check   |   Cross-shot identity → Thinking   |   Confirmed distinctions block joins</text><text x="710" y="490" font-size="12" fill="#50677e">Boundary / ownership use dedicated checks; failed pairs stay deferred</text><path d="M366 468 L366 505" stroke="#49729e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="630" width="507" height="52" rx="12" fill="#dbeafe" stroke="#849fbd" stroke-width="1.5"/><text x="283.5" y="657.0" font-size="20" font-weight="700" fill="#15314d">Global entity list</text><rect x="583" y="630" width="507" height="52" rx="12" fill="#dbeafe" stroke="#849fbd" stroke-width="1.5"/><text x="836.5" y="657.0" font-size="20" font-weight="700" fill="#15314d">Shot summaries with common IDs</text><path d="M284 591 L284 626" stroke="#49729e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M836 591 L836 626" stroke="#49729e" stroke-width="2" fill="none" marker-end="url(#arrow)"/></g></svg>