    .viewport{height:calc(100svh - 96px);height:calc(100vh - 96px);padding:24px;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}.stage-frame{position:relative;flex:none;width:calc(1600px * var(--scale));height:calc(900px * var(--scale));box-shadow:0 6px 28px #162c3810,0 0 0 1px #d3d9d5;background:var(--paper)}.stage{width:1600px;height:900px;position:absolute;inset:0;transform:scale(var(--scale));transform-origin:top left;overflow:hidden;background:var(--paper)}.slides{position:absolute;inset:0}.slide{position:absolute;inset:0;visibility:hidden;pointer-events:none;opacity:0;background:var(--paper);transition:opacity 150ms ease}.slide.is-active{visibility:visible;pointer-events:auto;opacity:1}.slide-head{position:absolute;left:80px;right:80px;top:44px}.kicker{display:flex;align-items:center;gap:12px;font-size:12px;line-height:1.2;font-weight:700;letter-spacing:2.1px;text-transform:uppercase;color:var(--muted)}.kicker::before{content:'';width:25px;height:3px;display:block;background:var(--phase-color,var(--ink))}.slide-head h1{margin:19px 0 10px;font-size:38px;line-height:1.35;font-weight:700;letter-spacing:-1px;color:var(--ink)}.subtitle{margin:0;font-size:19px;line-height:1.5;font-weight:400;letter-spacing:-.25px;color:var(--muted);max-width:1370px}.diagram{position:absolute;left:80px;top:188px;width:1440px;height:570px;display:flex;align-items:center;justify-content:center}.diagram>svg{display:block;width:1440px;height:570px;overflow:visible}.takeaway{position:absolute;left:80px;right:80px;top:779px;margin:0;font-size:20px;line-height:1.55;letter-spacing:-.15px;max-height:62px;color:var(--ink);padding-left:18px;border-left:3px solid var(--phase-color,var(--ink))}.takeaway strong{font-weight:700}.slide>.notes{display:none!important}.slide[data-phase=observe]{--phase-color:var(--observe)}.slide[data-phase=link]{--phase-color:var(--link)}.slide[data-phase=review]{--phase-color:var(--review)}.slide[data-phase=export]{--phase-color:var(--export)}.slide[data-phase=all]{--phase-color:var(--ink)}
    .stage-footer,.print-footer{position:absolute;left:80px;right:80px;bottom:22px;height:28px;border-top:1px solid var(--rule);display:flex;align-items:flex-end;justify-content:space-between;gap:30px;color:var(--muted);font-size:10px;letter-spacing:.6px}.phase-rail{display:flex;align-items:center;gap:18px}.phase{display:flex;align-items:center;gap:7px;opacity:.44;font-size:10px}.phase::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}.phase[data-phase=observe]{color:var(--observe)}.phase[data-phase=link]{color:var(--link)}.phase[data-phase=review]{color:var(--review)}.phase[data-phase=export]{color:var(--export)}.phase.is-current{opacity:1;font-weight:700}.phase-link{color:#b3bcb6;font-size:10px}.footer-meta{display:flex;gap:27px;align-items:center}.footer-counter{font-size:11px;font-variant-numeric:tabular-nums;color:var(--ink);min-width:43px;text-align:right}.print-footer{display:none}.app-footer{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;color:#748079;font-size:10px;letter-spacing:.2px}.key{font:inherit;border:1px solid #ccd4cd;border-radius:3px;padding:1px 4px;color:#657168;background:#f6f6f2}.footer-help{display:flex;align-items:center;gap:10px}.footer-status{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%}

px;background:#e9ede8;border-radius:4px}.notes-copy table{border-collapse:collapse;font-size:12px;width:100%}.notes-copy th,.notes-copy td{border-bottom:1px solid var(--rule);padding:8px 6px;text-align:left}.empty-state{padding:60px 80px;color:var(--muted);font-size:24px}.no-script{position:fixed;left:20px;bottom:20px;padding:15px;background:white;color:var(--ink);z-index:20}
    @media(max-width:780px){.app-bar{padding:0 12px;gap:5px}.brand-label span{display:none}.brand-label{font-size:10px;letter-spacing:1px}.brand{gap:7px}.brand-mark{width:21px;height:21px}.toolbar{gap:1px}.tool-button{padding:0 7px;gap:4px}.tool-label{display:none}.separator{margin:0 3px}.viewport{padding:12px}.app-footer{padding:0 12px;font-size:9px}.footer-help{gap:6px}.footer-help .optional{display:none}.footer-status{max-width:44%}.page-number{min-width:40px}.panel{width:min(390px,100vw)}}
    @media(max-width:420px){.brand-label{display:none}.toolbar .separator{display:none}.tool-button{padding:0 6px}.page-control .icon-button{min-width:27px}.page-number{min-width:36px}.footer-help{font-size:8px;gap:4px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
    @page{size:1600px 900px;margin:0}
    @media print{html,body{background:var(--paper);margin:0;padding:0;width:1600px;height:auto;overflow:visible;-webkit-print-color-adjust:exact;print-color-adjust:exact}.app-bar,.app-footer,.panel,.panel-shade,.stage-footer,.no-script{display:none!important}.viewport{display:block;height:auto;overflow:visible;padding:0}.stage-frame{position:static;width:1600px!important;height:auto!important;background:none;box-shadow:none}.stage{position:static;width:1600px;height:auto;overflow:visible;transform:none!important}.slides{position:static}.slide{position:relative!important;inset:auto!important;width:1600px;height:900px;visibility:visible!important;opacity:1!important;pointer-events:auto;overflow:hidden;break-after:page;page-break-after:always;break-inside:avoid;page-break-inside:avoid;transition:none!important}.slide:last-child{break-after:auto;page-break-after:auto}.slide>.notes{display:none!important}.print-footer{display:flex!important}}

<body>
  <header class="app-bar" aria-label="프레젠테이션 도구">
    <div class="brand" aria-label="04 Entity Extraction"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><div class="brand-label">04 / METHOD<span>Entity Extraction</span></div></div>
    <nav class="toolbar" aria-label="슬라이드 조작">
      <button class="tool-button" type="button" id="contentsToggle" aria-label="슬라이드 목차 열기" aria-expanded="false" aria-controls="contentsPanel" title="목차 (C)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h13M8 12h13M8 19h13M3 5h.1M3 12h.1M3 19h.1"/></svg><span class="tool-label">목차</span></button>
      <span class="separator" aria-hidden="true"></span>
      <div class="page-control"><button class="tool-button icon-button" type="button" id="previous" aria-label="이전 슬라이드" title="이전 (←)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button><span class="page-number"><strong id="currentNumber">1</strong> / <span id="totalNumber">0</span></span><button class="tool-button icon-button" type="button" id="next" aria-label="다음 슬라이드" title="다음 (→ / Space)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 7 7-7 7"/></svg></button></div>
      <span class="separator" aria-hidden="true"></span>
      <button class="tool-button" type="button" id="notesToggle" aria-label="상세 설명 열기" aria-expanded="false" aria-controls="notesPanel" title="상세 설명 (N)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h10l4 4v14H5zM14 3v5h5M8 12h8M8 16h6"/></svg><span class="tool-label">설명</span></button>
      <button class="tool-button icon-button" type="button" id="fullscreen" aria-label="전체 화면" aria-pressed="false" title="전체 화면 (F)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button>
      <button class="tool-button icon-button" type="button" id="print" aria-label="전체 슬라이드 인쇄 또는 PDF 저장" title="전체 슬라이드 인쇄 / PDF"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V3h10v5M7 17H3V9h18v8h-4M7 14h10v7H7zM17 11h1"/></svg></button>
      <button class="tool-button icon-button" type="button" id="download" aria-label="독립 HTML 파일 다운로드" title="오프라인 HTML 저장"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg></button>
    </nav>
  </header>
  <main class="viewport" id="viewport" aria-label="슬라이드 발표 영역">
    <div class="stage-frame" id="stageFrame"><div class="stage" id="stage">
      <div class="slides" id="slides">
        <!--SLIDES-->
      </div>
      <footer class="stage-footer" id="stageFooter" aria-label="현재 처리 단계"></footer>
    </div></div>
  </main>
  <footer class="app-footer"><div class="footer-help"><span><kbd class="key">←</kbd> <kbd class="key">→</kbd> 이동</span><span><kbd class="key">N</kbd> 설명</span><span class="optional"><kbd class="key">F</kbd> 전체 화면</span><span class="optional"><kbd class="key">C</kbd> 목차</span></div><span class="footer-status" id="status">HTML · 오프라인 사용 가능</span></footer>
  <div class="panel-shade" id="panelShade" aria-hidden="true"></div>
  <aside class="panel" id="contentsPanel" aria-labelledby="contentsTitle" aria-hidden="true" inert><div class="panel-head"><div><h2 id="contentsTitle">슬라이드 목차</h2><p>원하는 단계로 바로 이동합니다.</p></div><button class="tool-button icon-button panel-close" type="button" data-close="contents" aria-label="목차 닫기" title="닫기 (Esc)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="panel-body"><ol class="contents-list" id="contentsList"></ol></div></aside>
  <aside class="panel" id="notesPanel" aria-labelledby="notesTitle" aria-hidden="true" inert><div class="panel-head"><div><h2 id="notesTitle">상세 설명</h2><p id="notesSubtitle"></p></div><button class="tool-button icon-button panel-close" type="button" data-close="notes" aria-label="상세 설명 닫기" title="닫기 (Esc)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="panel-body notes-copy" id="notesCopy"></div></aside>
  <div class="sr-only" role="status" aria-live="polite" aria-atomic="true" id="announcement"></div>
  <noscript><p class="no-script">슬라이드 이동에는 JavaScript가 필요합니다. 브라우저에서 JavaScript를 허용해 주세요.</p></noscript>
  <script>
    (() => {
      'use strict';
      const slides = Array.from(document.querySelectorAll('#slides > .slide'));
      const $ = (id) => document.getElementById(id);
      const phaseNames = {observe:'관측 · 중복 정리',link:'외형 연결',review:'Qwen 검토',export:'결과 저장',all:'전체 과정'};
      const phases = ['observe','link','review','export'];
      let current = 0;
      let openPanel = null;
      let lastPanelTrigger = null;
      const baseTitle = document.title;
      const node = (tag, text, className) => {const value=document.createElement(tag);if(text!==undefined)value.textContent=text;if(className)value.className=className;return value;};
      const pad = (value) => String(value).padStart(2,'0');
      const titleFor = (slide) => slide.dataset.title || slide.querySelector('h1')?.textContent || '처리 방법';
      function footerFor(index) {
        const fragment=document.createDocumentFragment(),rail=node('div',undefined,'phase-rail');
        const active=slides[index]?.dataset.phase || 'all';
        phases.forEach((phase,i)=>{if(i)rail.append(node('span','→','phase-link'));const item=node('span',phaseNames[phase],'phase');item.dataset.phase=phase;item.classList.toggle('is-current',active==='all'||active===phase);rail.append(item);});
        const meta=node('div',undefined,'footer-meta');meta.append(node('span','04 / ENTITY EXTRACTION'),node('span',`${pad(index+1)} / ${pad(slides.length)}`,'footer-counter'));fragment.append(rail,meta);return fragment;
      }
      function fit() {
        const viewport=$('viewport'),style=getComputedStyle(viewport);
        const width=viewport.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight);
        const height=viewport.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);
        document.documentElement.style.setProperty('--scale',String(Math.max(.05,Math.min(width/1600,height/900))));
      }
      function readHash() {const value=location.hash.match(/^#slide-(\d+)$/);return value?Math.max(0,Math.min(slides.length-1,Number(value[1])-1)):0;}
      function updateNotes() {
        const slide=slides[current];if(!slide)return;
        $('notesSubtitle').textContent=`${pad(current+1)} / ${pad(slides.length)} · ${titleFor(slide)}`;
        const notes=slide.querySelector(':scope > .notes');
        $('notesCopy').replaceChildren();
        if(notes&&notes.innerHTML.trim())Array.from(notes.childNodes).forEach(child=>$('notesCopy').append(child.cloneNode(true)));
        else $('notesCopy').append(node('p','이 슬라이드에는 별도의 상세 설명이 없습니다.'));
      }
      function show(index,{hash=true,announce=true}={}) {
        if(!slides.length)return;
        current=Math.max(0,Math.min(slides.length-1,index));
        slides.forEach((slide,i)=>{const active=i===current;slide.classList.toggle('is-active',active);slide.setAttribute('aria-hidden',String(!active));slide.inert=!active;});
        $('currentNumber').textContent=current+1;$('previous').disabled=current===0;$('next').disabled=current===slides.length-1;
        $('stageFooter').replaceChildren(footerFor(current));
        document.querySelectorAll('.contents-button').forEach((button,i)=>{if(i===current)button.setAttribute('aria-current','step');else button.removeAttribute('aria-current');});
        updateNotes();document.title=`${titleFor(slides[current])} · ${baseTitle}`;
        if(hash&&location.hash!==`#slide-${current+1}`){try{history.replaceState(null,'',`#slide-${current+1}`);}catch(error){location.hash=`slide-${current+1}`;}}
        if(announce)$('announcement').textContent=`슬라이드 ${current+1} / ${slides.length}. ${titleFor(slides[current])}`;
      }
      function closePanels({focus=true}={}) {
        for(const name of ['contents','notes']){const panel=$(name+'Panel');panel.classList.remove('is-open');panel.setAttribute('aria-hidden','true');panel.inert=true;$(name+'Toggle').setAttribute('aria-expanded','false');}
        $('panelShade').classList.remove('is-open');openPanel=null;if(focus&&lastPanelTrigger)lastPanelTrigger.focus();
      }
      function togglePanel(name) {
        if(openPanel===name){closePanels();return;}
        closePanels({focus:false});openPanel=name;lastPanelTrigger=$(name+'Toggle');
        const panel=$(name+'Panel');panel.inert=false;panel.setAttribute('aria-hidden','false');panel.classList.add('is-open');lastPanelTrigger.setAttribute('aria-expanded','true');$('panelShade').classList.add('is-open');
        if(name==='notes')updateNotes();panel.querySelector('.panel-close').focus();
      }
      async function fullscreen() {
        try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else throw new Error('Unavailable');}
        catch(error){$('status').textContent='전체 화면은 새 브라우저 탭에서 사용할 수 있습니다.';$('announcement').textContent=$('status').textContent;}
      }
      function download() {
        const copy=document.documentElement.cloneNode(true);
        copy.querySelectorAll('.print-footer').forEach(footer=>footer.remove());
        copy.querySelector('#contentsList')?.replaceChildren();
        copy.querySelector('#notesCopy')?.replaceChildren();
        copy.querySelector('title').textContent=baseTitle;
        const url=URL.createObjectURL(new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'}));
        const link=node('a');link.href=url;link.download='METHOD_SLIDES.html';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
        $('status').textContent='오프라인 HTML 파일을 저장했습니다.';
      }
      $('totalNumber').textContent=slides.length;
      slides.forEach((slide,index)=>{
        slide.setAttribute('role','group');slide.setAttribute('aria-roledescription','슬라이드');slide.setAttribute('aria-label',`${index+1} / ${slides.length}: ${titleFor(slide)}`);
        slide.querySelectorAll(':scope > .print-footer').forEach(footer=>footer.remove());
        const footer=node('div',undefined,'print-footer');footer.setAttribute('aria-hidden','true');footer.append(footerFor(index));slide.append(footer);
        const item=node('li'),button=node('button',undefined,'contents-button');button.type='button';button.dataset.index=String(index);
        const label=node('span',titleFor(slide),'contents-title');label.append(node('span',phaseNames[slide.dataset.phase]||phaseNames.all,'contents-phase'));button.append(node('span',pad(index+1),'contents-index'),label);
        button.addEventListener('click',()=>{show(index);closePanels();});item.append(button);$('contentsList').append(item);
      });
      if(!slides.length){$('slides').append(node('p','슬라이드 내용을 준비하고 있습니다.','empty-state'));$('previous').disabled=true;$('next').disabled=true;}
      $('previous').addEventListener('click',()=>show(current-1));$('next').addEventListener('click',()=>show(current+1));
      $('contentsToggle').addEventListener('click',()=>togglePanel('contents'));$('notesToggle').addEventListener('click',()=>togglePanel('notes'));
      document.querySelectorAll('.panel-close').forEach(button=>button.addEventListener('click',()=>closePanels()));$('panelShade').addEventListener('click',()=>closePanels());
      $('fullscreen').addEventListener('click',fullscreen);$('print').addEventListener('click',()=>{closePanels({focus:false});window.print();});$('download').addEventListener('click',download);
      document.addEventListener('fullscreenchange',()=>{$('fullscreen').setAttribute('aria-pressed',String(Boolean(document.fullscreenElement)));fit();});
      document.addEventListener('keydown',(event)=>{
        const target=event.target;
        if(event.ctrlKey||event.metaKey||event.altKey||target.closest('input,textarea,select,[contenteditable=true]'))return;
        if(event.key==='Escape'&&openPanel){event.preventDefault();closePanels();return;}
        if(event.key==='Tab'&&openPanel){const focusable=Array.from($(openPanel+'Panel').querySelectorAll('button,a[href],input,select,textarea,[tabindex]')).filter(element=>!element.disabled&&element.tabIndex>=0),first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}return;}
        if(event.key===' '&&target.closest('button,a,summary'))return;
        const key=event.key.toLowerCase();
        if(['arrowright','arrowdown','pagedown',' '].includes(key)){event.preventDefault();show(current+1);}
        else if(['arrowleft','arrowup','pageup'].includes(key)){event.preventDefault();show(current-1);}
        else if(key==='home'){event.preventDefault();show(0);}
        else if(key==='end'){event.preventDefault();show(slides.length-1);}
        else if(key==='n'){event.preventDefault();togglePanel('notes');}
        else if(key==='c'){event.preventDefault();togglePanel('contents');}
        else if(key==='f'){event.preventDefault();fullscreen();}
      });
      let gesture=null;
      $('viewport').addEventListener('pointerdown',(event)=>{if(event.pointerType==='touch')gesture={x:event.clientX,y:event.clientY,id:event.pointerId};});
      $('viewport').addEventListener('pointerup',(event)=>{if(!gesture||gesture.id!==event.pointerId)return;const dx=event.clientX-gesture.x,dy=event.clientY-gesture.y;gesture=null;if(Math.abs(dx)>70&&Math.abs(dy)<Math.abs(dx)*.55)show(current+(dx<0?1:-1));});
      $('viewport').addEventListener('pointercancel',()=>{gesture=null;});
      window.addEventListener('hashchange',()=>show(readHash(),{hash:false}));window.addEventListener('resize',fit);window.addEventListener('afterprint',fit);
      if('ResizeObserver' in window)new ResizeObserver(fit).observe($('viewport'));
      closePanels({focus:false});show(readHash(),{announce:false});fit();
      if(document.fonts?.ready)document.fonts.ready.then(fit);
    })();
  </script>
</body>
</html>
