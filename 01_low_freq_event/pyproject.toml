[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "low-freq-video-events"
version = "0.1.0"
description = "Standalone low-frequency Qwen video event extraction"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["low_freq_event*"]

[tool.setuptools.package-data]
low_freq_event = ["viewer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
