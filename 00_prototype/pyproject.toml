[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "three-r-video"
version = "0.1.0"
description = "Local Qwen3-VL video event extraction and character identity tracking"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["video_events*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
